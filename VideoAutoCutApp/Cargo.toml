[package]
name = "video_auto_app"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "VideoAutoCutEngine"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
indicatif = "0.17"
regex = "1.11"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
sanitize-filename = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
